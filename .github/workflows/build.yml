name: Build APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-28
            build-tools;34.0.0

      - name: Build with build_apk.py
        run: python3 build_apk.py --clean

      - name: Show artifact info
        run: |
          ls -lh out
          unzip -l out/*.apk | head -20

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: haval-h6-cluster-media-apk
          path: out/*.apk
          if-no-files-found: error
